name: Deploy web-preview (Wrangler)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy web-preview
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web-preview
        run: |
          cd apps/web-preview
          bun run build

      - name: Setup Node (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wrangler
        run: npm install -g @cloudflare/wrangler

      - name: Publish to Cloudflare Pages (Wrangler)
        if: env.CF_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx -y @cloudflare/wrangler@3 pages publish ./dist/web-preview --project-name "${{ secrets.CF_PAGES_PROJECT }}" --branch main

      - name: Skip publish when missing secrets
        if: env.CF_API_TOKEN == '' || env.CF_PAGES_PROJECT == ''
        run: echo "CF_API_TOKEN or CF_PAGES_PROJECT secret not set; skipping publish."

# Notes:
# - Add `CF_API_TOKEN` and `CF_PAGES_PROJECT` in repository Secrets.
# - This workflow builds `apps/web-preview` and publishes the output folder
#   `./dist/web-preview` to Cloudflare Pages using Wrangler.
