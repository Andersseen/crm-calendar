<div class="app-layout" [class.sidebar-collapsed]="!layoutService.sidebarExpanded()">
  
  <!-- Sidebar Panel -->
  <crm-sidebar [navItems]="navItems()" />

  <!-- Content & Aux Panel Area -->
  <div class="view-container">
    
    <!-- Top Header Panel -->
    <crm-header [title]="title()" [subtitle]="subtitle()">
      <ng-content select="[header-actions]" header-actions></ng-content>
    </crm-header>

    <!-- Main & Aux Content -->
    <div class="content-wrapper">
      <main class="main-content">
        <ng-content></ng-content>
      </main>

      <!-- Auxiliary Side Panel -->
      <crm-aux-panel />
    </div>

  </div>
</div>
